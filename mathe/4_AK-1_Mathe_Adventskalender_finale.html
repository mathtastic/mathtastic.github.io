<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eine Einladung zum Nordpol</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Nunito:wght@400;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:#FAF7F1;font-family:Nunito,sans-serif;color:#1a1a1a;
  display:flex;justify-content:center;padding:26px 16px 40px;overflow-x:hidden;}
.box{max-width:520px;width:100%;}
.kopf{text-align:center;}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#946A1C;}
h1{font-family:Lora,serif;font-size:25px;color:#3F6E55;margin:4px 0 6px;}
.sub{font-family:Lora,serif;font-size:15px;line-height:1.55;color:#4a453d;margin:0 0 18px;}
.karte{background:#fff;border:1.3px solid #E3CC93;border-radius:12px;padding:18px 18px 20px;}
label{display:block;font-weight:800;font-size:13px;color:#3F6E55;margin-bottom:8px;}
input{width:100%;font-family:Lora,serif;font-size:21px;font-weight:700;letter-spacing:.06em;
  padding:12px 14px;border:2px solid #E3CC93;border-radius:10px;text-transform:uppercase;}
input:focus{outline:none;border-color:#B8892E;box-shadow:0 0 0 3px #B8892E33;}
button{margin-top:14px;width:100%;background:#3F6E55;color:#fff;border:0;border-radius:30px;
  padding:14px 20px;font-family:Nunito,sans-serif;font-size:17px;font-weight:800;cursor:pointer;}
#msg{margin-top:16px;font-family:Lora,serif;font-size:15px;line-height:1.6;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chips span{padding:4px 10px;border-radius:8px;font-family:Nunito,sans-serif;font-size:13px;font-weight:800;}
.ok{background:#E6F2EA;color:#24553D;} .no{background:#FBEBD9;color:#8A4B1E;}
.brief{display:none;margin-top:20px;background:#FFFDF6;border:1.4px solid #B8892E;border-radius:12px;
  padding:20px 20px 22px;font-family:Lora,serif;font-size:16px;line-height:1.7;}
.brief img{display:block;width:170px;margin:0 auto 10px;}
.brief .gruss{font-family:Caveat,cursive;font-size:30px;color:#3F6E55;margin-top:8px;}
.confetti{position:fixed;top:-20px;z-index:9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg);}}
</style></head><body><div class="box">
<div class="kopf"><div class="eyebrow">Mathe-Adventskalender &middot; Klasse 4</div>
