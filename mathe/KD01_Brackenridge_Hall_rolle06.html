<style>
:root{--grund:#1E2422;--papier:#F6F3EE;--tinte:#24211D;--akzent:#8C867D;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--grund);color:var(--tinte);font-family:Georgia, 'Times New Roman', serif;
  font-size:17px;line-height:1.55;padding:22px 16px 40px;min-height:100vh}
.karte{max-width:560px;margin:0 auto;background:var(--papier);border-radius:6px;
  padding:26px 22px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  border-top:4px solid var(--akzent)}
.kicker{margin:0 0 6px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--akzent)}
h1{margin:0 0 4px;font-size:26px;line-height:1.2;font-weight:normal}
.unter{margin:0 0 18px;font-style:italic;opacity:.8}
.vorspann{margin:0 0 16px}
#schloss p{margin:0 0 10px}
#form{display:flex;gap:8px;flex-wrap:wrap}
#code{flex:1 1 180px;font:inherit;font-size:20px;letter-spacing:.12em;padding:10px 12px;
  border:1.5px solid var(--tinte);border-radius:4px;background:#fff;color:var(--tinte);
  text-transform:uppercase}
#form button{font:inherit;font-size:17px;padding:10px 18px;border:0;border-radius:4px;
  background:var(--tinte);color:var(--papier);cursor:pointer}
#meldung{min-height:1.5em;margin-top:10px;font-style:italic}
.wackel{animation:wackel .35s}
@keyframes wackel{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#inhalt h2{font-weight:normal;font-size:20px;border-bottom:1px solid var(--akzent);
  padding-bottom:4px;margin:22px 0 10px}
#inhalt img{max-width:100%;height:auto}
#inhalt details{border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:8px 12px;margin:10px 0}
#inhalt summary{cursor:pointer}
footer{max-width:560px;margin:14px auto 0;text-align:center;font-size:12px;
  color:var(--papier);opacity:.6}
</style></head>

 spellcheck="false" aria-label="Code" placeholder="Code">

</form>

</div>
<div id="inhalt" hidden></div>
