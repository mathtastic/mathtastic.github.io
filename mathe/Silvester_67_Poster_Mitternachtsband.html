<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Poster Mitternachtsband · Silvester rund um die Welt – Klasse 6+7</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── BODY ───────────────────────────────────────────────── */
body { background: #F0EDE8; font-family: 'Nunito', sans-serif; font-size: 14px; color: #1a1a1a; line-height: 1.65; padding: 30px 20px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

/* ── SEITE ───────────────────────────────────────────────── */
.page { width: 210mm; height: 297mm; overflow: hidden; background: #fff; margin: 0 auto 40px; padding: 10mm 15mm 20mm; box-shadow: 0 4px 24px rgba(0,0,0,.10); display: flex; flex-direction: column; position: relative; }
/* Bottom-Padding 20mm (statt 10mm) — Drucker-Sicherheits-Rand, Basti 2026-05-26 */
/* Tiefe Fußzeile für neue Reihen (Basti-OK 2026-11-07, MASTER §7b): +30 px je Schülerseite */
.page.tief { padding-bottom: 12mm; }
.page-loe { /* kein border-top mehr — loe-badge oben rechts reicht als Marker */ }

/* ── KOPFZEILE ───────────────────────────────────────────── */
.loe-badge { position: absolute; top: 10mm; right: 17mm; font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: white; padding: 3px 10px 3px 8px; border-radius: 0 4px 4px 0; background: #1A7A50; }
.sequenz-badge { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; color: #5A5A5A; text-transform: uppercase; letter-spacing: .10em; text-align: center; margin-bottom: 3px; }
.pg-title { text-align: center; font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 18px; }

.pg-head-compact { text-align: center; margin-bottom: 14px; font-family: 'Lora', serif; font-size: 17px; font-weight: 600; color: #1a1a1a; }
.pg-head-compact .phc-badge { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .08em; }

.tr-badge { display: inline-flex; align-items: center; gap: 5px; font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-bottom: 10px; }
.tr-badge.ohne { background: #E8F0FA; color: #1C5F96; border: 1px solid #A8C4E0; }
.tr-badge.mit  { background: #FEF9EE; color: #CF7C09; border: 1px solid #E8C870; }

/* ── SCOTCH-TAPE ─────────────────────────────────────────── */
.tape-tl, .tape-tr, .tape-bl, .tape-br { position: absolute; width: 36px; height: 20px; background: rgba(235,222,175,0.90); filter: drop-shadow(0px 0px 1px rgba(0,0,0,0.55)); clip-path: polygon(0% 0%,9% 20%,2% 45%,10% 70%,3% 90%,0% 100%,100% 100%,97% 80%,100% 55%,91% 30%,98% 10%,92% 0%); }
.tape-tl { top: -4px; left: -2px; transform: rotate(-38deg); }
.tape-tr { top: -4px; right: -2px; transform: rotate(38deg); }
.tape-bl { bottom: -4px; left: -2px; transform: rotate(38deg); }
.tape-br { bottom: -4px; right: -2px; transform: rotate(-38deg); }
/* Kleinere Variante (für kompakte Karten): füge zusätzlich Klasse .tape-mini hinzu */
.tape-tl.tape-mini, .tape-tr.tape-mini, .tape-bl.tape-mini, .tape-br.tape-mini { width: 26px; height: 14px; }

/* ── BOXEN ───────────────────────────────────────────────── */
.tape-box { position: relative; background: #FDFAF0; border: 1.5px solid #D0C898; border-radius: 5px; padding: 12px 14px 11px; margin-bottom: 24px; font-family: 'Lora', serif; font-size: 14px; line-height: 1.65; }

.def-tape { position: relative; background: #FDFAF0; border: 1.5px solid #D0C898; border-radius: 5px; padding: 10px 13px; margin-bottom: 15px; }
.def-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed #D0C898; font-size: 14px; font-family: 'Nunito', sans-serif; }
.def-row:last-child { border-bottom: none; padding-bottom: 0; }
.def-left { font-family: 'Caveat', cursive; font-size: 14px; font-weight: 700; color: #1C5F96; line-height: 1.3; }

.merk-box { position: relative; background: #FFFDE6; border: 1.5px solid #E8D84A; border-radius: 5px; padding: 14px 13px 13px; font-family: 'Lora', serif; font-size: 14px; line-height: 2.2; margin-top: 18px; }
.merk-label { font-family: 'Lora', serif; font-size: 14px; font-weight: 700; font-style: italic; color: #6B5A00; margin-bottom: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* .spick-box (gelber Notizzettel) ENTFERNT 2026-06-22 — abgelöst durch beispiel_box (EDUKI §1.10). */

/* TIPP-BUBBLE (.tipp-box/.tipp-side/.tipp-bubble/.tipp-dots) ENTFERNT 2026-06-22 —
   blaue Gedankenblase abgelöst. Tipp heute = QR auf gehostete Seite / Caveat-sprechblase.
   Siehe EDUKI_DESIGN §1.13. Spec-Archiv: system/_archiv/MASTER_DESIGN_§6_Boxen_2026-06-22.md */

.exp-block { background: #FFF5EB; border: 1.5px solid #D4892A; border-left: 4px solid #E8821A; border-radius: 5px; padding: 12px 13px; margin-bottom: 16px; position: relative; }
.exp-header { font-family: 'Lora', serif; font-size: 14px; font-weight: 700; color: #8B4500; margin-bottom: 6px; }
.exp-body { font-family: 'Nunito', sans-serif; font-size: 14px; line-height: 1.75; }

.video-box { display: flex; align-items: center; gap: 12px; background: #FAFAFA; border: 1.5px solid #E0DDD5; border-left: 4px solid #E0302A; border-radius: 6px; padding: 11px 14px; margin-bottom: 16px; }
.video-icon { width: 36px; height: 36px; background: #E0302A; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; color: white; }
.video-info { flex: 1; }
.video-info .video-titel { font-family: 'Lora', serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; }
.video-info .video-link { font-family: 'Nunito', sans-serif; font-size: 12px; color: #E0302A; font-weight: 700; }
.video-info .video-desc { font-family: 'Nunito', sans-serif; font-size: 12px; color: #666; margin-top: 3px; }

/* ── SEC-HDR (NUR Lösungsblatt) ──────────────────────────── */
.sec-hdr { font-family: 'Lora', serif; font-size: 14px; font-weight: 700; color: #1a1a1a; margin: 10px 0 5px; padding: 3px 0 3px 8px; display: flex; align-items: center; gap: 10px; }
.sec-hdr::before { content: '\2713'; display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2A8B5C 0%, #1A7A50 60%); color: white; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.25), inset 1px 1px 1.5px rgba(255,255,255,0.30); flex-shrink: 0; }

/* ── AUFGABEN ────────────────────────────────────────────── */
.auf { margin-bottom: 30px; }  /* Wendy-Abstand minimal reduziert (war 34, davor 28) — Basti 2026-05-27 */
.auf:last-of-type { margin-bottom: 0; }
.auf-label { font-family: 'Lora', serif; font-size: 14px; font-weight: 700; margin-bottom: 5px; line-height: 1.65; }
.auf-body { font-family: 'Nunito', sans-serif; font-size: 14px; line-height: 1.75; }
.teil { display: flex; gap: 6px; margin-top: 18px; font-size: 14px; align-items: flex-start; }
/* Wendy-Abstände: Teilaufgaben kompakter (18px), erste nah am Aufg-Titel (10px) — Basti 2026-05-27 */
.teil:first-of-type { margin-top: 10px; }
.tn { font-weight: 700; color: #555; min-width: 20px; flex-shrink: 0; }
.sf { font-style: italic; color: #777; font-size: 12px; }

/* ── SCHREIBLINIEN ───────────────────────────────────────── */
.ll { display: flex; flex-direction: column; gap: 26px; margin-top: 16px; }
.ll .l { border-bottom: 1.5px solid #bbb; width: 100%; min-height: 18px; display: block; }
.ll-compact { gap: 22px; margin-top: 12px; }
.ln { border-bottom: 1.5px solid #aaa; display: inline-block; min-width: 80px; height: 14px; vertical-align: bottom; margin: 0 2px; }
.luecke { display: inline-block; border-bottom: 1.5px solid #C8A800; min-width: 70px; height: 16px; vertical-align: bottom; margin: 0 3px; }

/* ── ZEICHENFLÄCHEN ──────────────────────────────────────── */
/* KÄSTCHEN-NORM: Gitter/Rahmen/Grund kommen AUSSCHLIESSLICH aus dem inline-SVG
   (draw_box/rechenraster/fuell_karo/kosy_box → templates.py, Norm §3.10: #A8A8A8 / 0,25 mm mm-slice).
   .draw-box ist nur noch Layout-Wrapper. Kein CSS-Gitter mehr (verschwand im S/W-Druck). */
.draw-box { margin-top: 14px; }
.draw-box-baum { background-color: #FAFEFA; background-image: repeating-linear-gradient(to right, #E8F0EC 0, #E8F0EC 0.5px, transparent 0.5px, transparent 10px), repeating-linear-gradient(to bottom, #E8F0EC 0, #E8F0EC 0.5px, transparent 0.5px, transparent 10px), repeating-linear-gradient(to right, transparent 0, transparent calc(33% - 1px), #A8D4C0 calc(33% - 1px), #A8D4C0 calc(33% + 1px), transparent calc(33% + 1px), transparent calc(66% - 1px), #A8D4C0 calc(66% - 1px), #A8D4C0 calc(66% + 1px), transparent calc(66% + 1px), transparent 100%); border: 1px solid #B8D8C8; border-radius: 4px; margin-top: 14px; height: 140px; }

/* ── BRÜCHE ──────────────────────────────────────────────── */
.b { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; line-height: 1.2; margin: 0 3px; font-size: 0.92em; text-align: center; }
.b .z { border-bottom: 1.4px solid currentColor; padding: 1px 4px 2px; display: block; white-space: nowrap; width: 100%; box-sizing: border-box; }
.b .n { padding: 2px 4px 0; display: block; white-space: nowrap; width: 100%; box-sizing: border-box; }

/* ── MATHE-NOTATION (Zeichenkatalog neuer LP · Cambria Math, AUFRECHT) ──
   .mv = Variable/Name · .mu = Ziffern/Klammern/Operatoren (beide aufrecht)
   .mov = Strecke (Überstrich) · .mvec = Vektorpfeil · siehe templates.py mv()/koord()/strecke() */
.nw  { white-space: nowrap; }
.mv  { font-family: 'Cambria Math','STIX Two Math',Cambria,'Times New Roman',serif; font-style: normal; font-size: 1.20em; }
.mu  { font-family: 'Cambria Math','STIX Two Math',Cambria,'Times New Roman',serif; font-style: normal; font-size: 1.20em; }
.mov { font-family: 'Cambria Math','STIX Two Math',Cambria,'Times New Roman',serif; font-style: normal; font-size: 1.20em; display: inline-block; line-height: 0.9; border-top: 1.3px solid currentColor; padding: 0.5px 1.5px 0; vertical-align: -0.03em; }
.mvec { position: relative; display: inline-block; font-family: 'Cambria Math','STIX Two Math',Cambria,'Times New Roman',serif; font-style: normal; font-size: 1.20em; }
.mvec::after { content: '\2192'; position: absolute; left: -0.04em; right: 0; top: -0.32em; font-size: 0.66em; line-height: 1; text-align: center; font-style: normal; }

/* ── TABELLEN ────────────────────────────────────────────── */
.mt-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; font-family: 'Nunito', sans-serif; }
.mt-tbl th { background: #D6E6F2; padding: 5px 7px; border: 1px solid #A8C4DD; font-weight: 700; text-align: center; color: #1C5F96; font-size: 12px; }
.mt-tbl td { border: 1px solid #D0D8E0; padding: 6px 7px; text-align: center; font-size: 12px; }
.mt-tbl td.fill { background: #FFFEF8; min-width: 36px; }
.mt-tbl td.label-cell { text-align: left; font-weight: 600; background: #F8FAFC; font-size: 12px; vertical-align: middle; }

/* ── CHECKBOX ────────────────────────────────────────────── */
.cb { display: inline-block; width: 13px; height: 13px; border: 1.5px solid #999; border-radius: 2px; vertical-align: middle; margin: 0 2px; }

/* ── VIERFELDERTAFEL ─────────────────────────────────────── */
.vft { border-collapse: collapse; width: 95%; font-size: 12px; margin: 8px 0; font-family: 'Nunito', sans-serif; }
.vft th, .vft td { border: 1px solid #bbb; padding: 6px 8px; text-align: center; }
.vft thead th { background: #F0F4F8; font-weight: 700; font-size: 12px; border-bottom: 2.5px solid #333; }
.vft .vft-row-hdr { background: #F0F4F8; font-weight: 700; text-align: left; border-right: 2.5px solid #333; }
.vft .vft-sum-row td { background: #F5F5F5; font-weight: 700; border-top: 2.5px solid #333; }
.vft .vft-sum-cell { background: #EEEEF0; font-weight: 700; border-left: 2.5px solid #333; }
.vft .vft-fill { background: #FFFEF8; color: #888; font-size: 14px; }

/* ── LAYOUTS ─────────────────────────────────────────────── */
.row-split { display: flex; gap: 14px; align-items: flex-start; }
.row-split .col-main { flex: 1; min-width: 0; }
.row-split .col-side { flex: 0 0 auto; }

.auf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; align-items: stretch; }
.grid-cell { font-size: 12.5px; line-height: 1.65; font-family: 'Nunito', sans-serif; }
.grid-cell .gc-label { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }

.data-card { background: #F8FAFC; border: 1px solid #E0E4EA; border-radius: 4px; padding: 8px 10px; font-size: 12.5px; line-height: 1.65; display: flex; flex-direction: column; }
.data-card .dc-label { font-weight: 700; color: #1C5F96; font-size: 12px; margin-bottom: 3px; font-family: 'Nunito', sans-serif; }

.ico { display: inline-block; vertical-align: middle; margin: 0 3px; flex-shrink: 0; }

/* ── LÖSUNG ──────────────────────────────────────────────── */
.loe-antwort { position: relative; background: #F4FBF7; border: 1.4px dashed #1A7A50; border-radius: 6px; padding: 9px 13px; margin: 5px 0 12px; font-family: 'Nunito', sans-serif; font-size: 12px; line-height: 1.62; }
.loe-antwort .sol { font-weight: 700; color: #0D5C35; }
.loe-antwort .teil { display: flex; gap: 6px; margin-top: 4px; font-size: 12px; align-items: flex-start; }
.loe-antwort .tn { font-weight: 700; color: #0D5C35; min-width: 20px; flex-shrink: 0; }
.loe-hinweis { font-family: 'Lora', serif; font-size: 12px; font-style: italic; color: #555; border-left: 3px solid #A8D4B8; padding-left: 8px; margin: 5px 0 0; line-height: 1.55; }

/* ── QR-BOX ──────────────────────────────────────────────── */
.qr-box { display: flex; align-items: center; gap: 10px; background: #F8FAF8; border: 1px solid #B8D4C0; border-radius: 5px; padding: 8px 12px; margin-top: auto; margin-bottom: 8px; align-self: flex-start; }
.qr-box-label { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; color: #1A7A50; }

/* ── SEITENNUMMER ────────────────────────────────────────── */
.seiten-nr { font-family: 'Nunito', sans-serif; font-size: 10px; color: #bbb; text-align: center; margin-top: auto; padding-top: 8px; }

/* ── DRUCK ────────────────────────────────────────────────── */
@media print {
@page { size: A4 portrait; margin: 0; }
body { background: white !important; padding: 0 !important; margin: 0 !important; }
.page { box-shadow: none !important; margin: 0 !important; page-break-after: always !important; break-after: page !important; width: 210mm !important; height: 297mm !important; min-height: 0 !important; overflow: hidden !important; padding: 12mm 15mm 20mm !important; }
.page.tief { padding-bottom: 12mm !important; }
* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
.loe-badge { background: #444 !important; }
/* (Lösungsblatt-spezifische Überschreibung weggefallen — sec-hdr nutzt jetzt einheitlich das ::before-Häkchen-Sticker-Design) */
.tape-box, .def-tape, .merk-box { background: #F8F8F5 !important; border-color: #ccc !important; }
.exp-block { background: #F8F5F0 !important; border-left-color: #888 !important; border-color: #bbb !important; }
/* .draw-box Print-Gitter entfällt — Kästchen kommen aus dem inline-SVG (Norm §3.10). */
.draw-box-baum { background-color: #F8FAF8 !important; }
.data-card { border-color: #ccc !important; background: #F8F8F8 !important; }
.mt-tbl th { background: #E8E8E8 !important; color: #333 !important; border-color: #bbb !important; }

}


/* Typo-Reform 2026-05-20 — Tape-Box auf Sans-Serif */
.tape-box { font-family: 'Nunito', sans-serif !important; line-height: 1.6 !important; }


.page[data-bogen] { background: #fff; padding: 0; }
.poster { position: absolute; left: 47px; top: 66px; }
</style></head>
